services:
  postgres:
    image: postgres:16
    container_name: certiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: certiflow_dev_password
      POSTGRES_DB: certiflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: