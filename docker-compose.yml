services:
  postgres:
    image: postgres:16-alpine
    container_name: certiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: certiflow
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - certiflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiflow -d certiflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://certiflow:${POSTGRES_PASSWORD:-change-me}@postgres:5432/certiflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: certiflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  certiflow_postgres_data:
